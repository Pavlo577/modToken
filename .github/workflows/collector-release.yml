# Builds the Codex collector into single-file programs (no Node needed on the user's computer) and attaches them to a release.
# Release: git tag collector-v1.0.0 && git push origin collector-v1.0.0, or publish a release with such a tag on GitHub
# (the files are then attached to it). A manual run only builds and keeps the files as artifacts.
name: Collector release

on:
  push:
    tags: ['collector-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release with this tag too (collector-vX.Y.Z; made from the chosen branch). Empty: only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, name: token-tracker-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, name: token-tracker-linux-arm64 }
          # macOS programs are built on a Mac so that Bun can sign them (unsigned ones do not start on Apple Silicon)
          - { os: macos-latest, target: bun-darwin-arm64, name: token-tracker-macos-arm64 }
          - { os: macos-latest, target: bun-darwin-x64, name: token-tracker-macos-x64 }
          - { os: windows-latest, target: bun-windows-x64, name: token-tracker-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compile
        shell: bash
        run: bun build --compile --minify --target=${{ matrix.target }} collectors/codex.mjs --outfile "dist/${{ matrix.name }}"
      - name: Smoke test (runs only where the program can run)
        if: ${{ !contains(matrix.target, 'x64') || matrix.os != 'macos-latest' }}
        shell: bash
        run: |
          out=$("dist/${{ matrix.name }}" status)
          echo "$out"
          echo "$out" | grep -q "not linked"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/collector-v') || startsWith(inputs.tag, 'collector-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          chmod +x token-tracker-linux-* token-tracker-macos-*
          sha256sum token-tracker-* > SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Collector ${TAG#collector-v}" \
              --notes "Single-file collector for Codex: no Node needed. See the README section 'Other agents (Codex)'."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber token-tracker-* SHA256SUMS
